mavuko:
  database:
    url: ${JDBC_DATABASE_URL}
    username: ${POSTGRES_USER:mavuko}
    password: ${POSTGRES_PASSWORD}
spring:
  autoconfigure:
    exclude: ""
  datasource:
    url: ${mavuko.database.url}
    username: ${mavuko.database.username}
    password: ${mavuko.database.password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
